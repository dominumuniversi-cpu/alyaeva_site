name: CI — проверки

# Ворота перед слиянием. Деплой НЕ здесь — только проверки.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: pip install -r app/requirements.txt

      - name: Синтаксис Python
        run: python -m compileall -q app

      - name: Синтаксис всех модулей
        run: python -m compileall -q app && echo "синтаксис в порядке"

      - name: Шаблоны Jinja2 разбираются
        run: |
          pip install jinja2
          python scripts/check_templates.py

      # Калькулятор адаптации постов проверяется без базы и без сети: это его свойство —
      # вход строки, выход строки. Провал здесь значит, что пост уйдёт мимо лимита площадки.
      - name: Контент-завод — адаптация под площадки
        run: python modules/content_factory/tests/test_module.py
      - name: Конфиг nginx валиден
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light >/dev/null
          # vhost проверяется отдельно — он ссылается на сертификаты прода
          echo "nginx доступен"

      - name: Проверка скриптов Node
        run: |
          for f in scripts/*.js; do node --check "$f" && echo "ok $f"; done

      # Блокирующая проверка оформления: «200 OK» не значит «страница выглядит нормально».
      # /login год жил без стилей именно так. Проверяем на превью-сборке живого сайта.
      - name: Стили всех страниц (headless-браузер)
        if: env.STYLE_CHECK_URL != ''
        env:
          STYLE_CHECK_URL: ${{ secrets.STYLE_CHECK_URL }}
          ADMIN_EMAIL: ${{ secrets.STYLE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.STYLE_ADMIN_PASSWORD }}
        run: |
          npm i puppeteer@23
          node scripts/check-styles.js "$STYLE_CHECK_URL"
