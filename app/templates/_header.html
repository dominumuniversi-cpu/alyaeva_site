<header class="topbar" id="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="/">Алёна Аляева</a>

    <button class="burger" type="button" aria-label="Меню" aria-expanded="false" aria-controls="mainnav">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="mainnav" aria-label="Разделы">
      {% if user %}
        <a href="/cabinet" {% if request.url.path == '/cabinet' %}class="on"{% endif %}>Мои заказы</a>
        <a href="/order" {% if request.url.path == '/order' %}class="on"{% endif %}>Заказать</a>
        <a href="/ceny" {% if request.url.path == '/ceny' %}class="on"{% endif %}>Стоимость</a>
        {% if user.role == 'admin' %}<a href="{{ admin_url }}">Админка</a>{% endif %}
      {% else %}
        <a href="/">На сайт</a>
        <a href="/order">Заказать</a>
        <a href="/ceny">Стоимость</a>
        <a href="/login">Вход</a>
      {% endif %}
      <span class="nav-icons">{% include "_social.html" %}</span>
      {% if user %}<a class="nav-out" href="/logout">Выйти</a>{% endif %}
    </nav>
  </div>
</header>
