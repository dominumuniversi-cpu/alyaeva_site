{% extends "base.html" %}
{% block title %}Вход — Алёна Аляева{% endblock %}
{% block content %}
<div class="auth-box card">
  <h1>Вход</h1>
  <p class="muted">Личный кабинет или админка</p>
  {% if error %}<div class="errors">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="email">E-mail</label>
    <input id="email" type="email" name="email" required autocomplete="username">
    <label for="password">Пароль</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <div style="margin-top:22px"><button class="btn" type="submit">Войти</button></div>
  </form>
  <p class="hint">Нет аккаунта? <a href="/register">Зарегистрироваться</a> — заказы, оформленные гостем, найдутся по номеру телефона.</p>
</div>
{% endblock %}
