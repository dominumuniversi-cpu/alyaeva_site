<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Алёна Аляева{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">Алёна Аляева</a>
    <nav class="nav">
      {% if user %}
        <a href="/cabinet">Мои заказы</a>
        <a href="/order">Заказать</a>
        {% if user.role == 'admin' %}<a href="{{ admin_url }}">Админка</a>{% endif %}
        <a href="/logout">Выйти</a>
      {% else %}
        <a href="/">На сайт</a>
        <a href="/login">Вход</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
