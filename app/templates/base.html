<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Алёна Аляева{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">Алёна Аляева</a>
    <nav class="nav">
      {% if user %}
        <a href="/cabinet">Мои заказы</a>
        <a href="/order">Заказать</a>
        {% if user.role == 'admin' %}<a href="{{ admin_url }}">Админка</a>{% endif %}
        <a href="/settings">Настройки</a>
        <a href="/logout">Выйти</a>
      {% else %}
        <a href="/">На сайт</a>
        <a href="/login">Вход</a>
      {% endif %}
    </nav>
  </div>
</header>
{% if user and user.role == 'admin' %}
<nav class="admin-subnav">
  <div class="wrap">
    <a href="{{ admin_url }}" {% if '/admin/client' not in request.url.path and request.url.path == admin_url %}class="active"{% endif %}>Заказы</a>
    <a href="/admin/clients" {% if request.url.path.startswith('/admin/client') %}class="active"{% endif %}>Клиенты</a>
    <a href="/admin/photos" {% if request.url.path.startswith('/admin/photos') %}class="active"{% endif %}>Все фото</a>
    <a href="{{ admin_url }}/inbox">Инбокс</a>
    <a href="{{ admin_url }}/products">Товары</a>
    <a href="{{ admin_url }}/hooks">Приём сообщений</a>
    <a href="{{ admin_url }}/settings">Настройки</a>
  </div>
</nav>
{% endif %}
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
