<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Алёна Аляева{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="{{ admin_url if user.role == 'admin' else '/cabinet' }}">Алёна Аляева</a>
  <nav>
    {% if user.role == 'admin' %}
      <a href="{{ admin_url }}">Заказы</a>
      <a href="{{ admin_url }}/inbox">Сообщения</a>
      <a href="{{ admin_url }}/products">Товары</a>
      <a href="{{ admin_url }}/settings">Настройки</a>
    {% else %}
      <a href="/cabinet">Мои заказы</a>
      <a href="/cabinet/projects">Мои фото</a>
    {% endif %}
    <span class="who">{{ user.full_name or user.email }}</span>
    <form method="post" action="/logout" class="inline"><button class="link">Выйти</button></form>
  </nav>
</header>
{% endif %}
<main class="{% block main_class %}wrap{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
