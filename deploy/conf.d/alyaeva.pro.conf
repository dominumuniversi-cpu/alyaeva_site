# СЛЕПОК живого vhostа от 26.11.2026 (задача #288) — для аудита и истории.
# ЖИВОЙ КОНФИГ: E:\DockerData\nginx\vhosts\alyaeva.pro.conf (перезапуск: docker exec proxy nginx -t && nginx -s reload).
# include /etc/nginx/vhosts/_app-proxy.inc и named location @maintenance лежат на проде
# рядом с живым конфигом. КАК ПРАВИТЬ: только по docs/deploy.md (переменная в proxy_pass
# + resolver, nginx -t перед reload). Этот файл НЕ применять к проду копированием.
# alyaeva.pro — внешний сайт. Контейнер alyaeva-site в сети npc-proxy-net.
# Включается в http{} через include /etc/nginx/vhosts/*.conf (НЕ в stands/).
# TLS: Let's Encrypt (TLS-ALPN-01), продление scripts/renew-cert.ps1
# 23.11.2026: реальный серт, ужесточён CSP (убран unsafe-eval), rate-limit, блок ботов, OCSP.

# --- HTTP: только redirect (80 перехватывается оборудованием провайдера, ACME идёт по TLS-ALPN на 443) ---
server {
    listen 80;
    server_name alyaeva.pro www.alyaeva.pro;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name alyaeva.pro www.alyaeva.pro;
    # Адреса контейнеров nginx узнаёт на каждом запросе, а не один раз при старте.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Пока приложение обновляется (контейнера нет) — вместо голого 502 страница «Сайт обновляется».
    # Отдаётся статикой, поэтому работает даже когда приложение недоступно.
    location @maintenance {
        set $alyaeva_static_m alyaeva-site;
        rewrite ^ /maintenance.html break;
        proxy_pass http://$alyaeva_static_m:80;
        proxy_set_header Host $host;
    }

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/alyaeva.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alyaeva.pro/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/alyaeva.pro/fullchain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ALY:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP: без unsafe-eval; inline-стили нужны только inline-style сайта
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # --- Служебное ---
    server_tokens off;
    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # --- Ограничение частоты (zone объявлена в nginx.conf) ---
    limit_req zone=alyaeva burst=30 nodelay;

    # --- Блокировка мусорных сканеров по UA ---
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zgrab|python-requests|curl/7\.5[0-9]) ) { return 403; }
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$ ) { return 405; }

    # --- Статика с долгим кэшем ---
    location ~* \.(png|jpe?g|webp|svg|woff2?|mp4|webm|ico)$ {
        set $alyaeva_static alyaeva-site;
        proxy_pass http://$alyaeva_static:80;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS приложения (/static/) идёт РАНЬШЕ общей регулярки: nginx проверяет ~* до префиксов,
    # иначе /static/app.css уходил в alyaeva-site (404) — страницы входа и кабинета оставались без стилей.
    location ^~ /static/ {
        set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000;
        include /etc/nginx/vhosts/_app-proxy.inc;
    }

    location ~* \.(css|js)$ {
        proxy_pass http://alyaeva-site:80;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Главная и лендинг: приложение ---
    # Раньше отдавались файлами из alyaeva-site, и контакты в них были вписаны руками:
    # правка телефона в админке до них не доходила (задача #244). Теперь приложение
    # подставляет контакты из настроек. Картинки, шрифты и css по-прежнему у alyaeva-site.
    location = / {
        set $alyaeva_upstream alyaeva-web;
        error_page 502 503 504 = @maintenance;
        proxy_pass http://$alyaeva_upstream:8000;
        include /etc/nginx/vhosts/_app-proxy.inc;
    }
    location = /fotokniga-ekaterinburg/ {
        set $alyaeva_upstream alyaeva-web;
        error_page 502 503 504 = @maintenance;
        proxy_pass http://$alyaeva_upstream:8000;
        include /etc/nginx/vhosts/_app-proxy.inc;
    }
    location = /index.html {
        proxy_pass http://alyaeva-site:80;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # --- Приложение: кабинет, вход, админка, API ---
    # Статика сайта по-прежнему отдаётся nginx'ом из alyaeva-site, сюда идут только динамические пути.
    # Оплата (#122): страница для покупателя и настройки в админке.
    location = /oplata {
        set $alyaeva_upstream alyaeva-web;
        error_page 502 503 504 = @maintenance;
        proxy_pass http://$alyaeva_upstream:8000;
        include /etc/nginx/vhosts/_app-proxy.inc;
    }
    location = /admin/pay {
        set $alyaeva_upstream alyaeva-web;
        error_page 502 503 504 = @maintenance;
        proxy_pass http://$alyaeva_upstream:8000;
        include /etc/nginx/vhosts/_app-proxy.inc;
    }
    location /cabinet { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /login    { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /register { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /order    { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /ceny     { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /policy   { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /logout   { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /settings { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location = /admin     { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /admin/    { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /hooks/    { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /api/     { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /health   { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }
    location /6b03c5256535e9ab5a { set $alyaeva_upstream alyaeva-web;
error_page 502 503 504 = @maintenance;        proxy_pass http://$alyaeva_upstream:8000; include /etc/nginx/vhosts/_app-proxy.inc; }

    location / {
        proxy_pass http://alyaeva-site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}