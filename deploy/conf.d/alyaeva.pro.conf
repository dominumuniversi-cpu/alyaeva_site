# Положить в: E:\DockerData\nginx\conf.d\alyaeva.pro.conf
# Сертификаты: E:\DockerData\nginx\certs\alyaeva.pro\ (fullchain.pem, privkey.pem)
# Получение первого сертификата: см. README-deploy.md (certbot webroot)

# --- HTTP: redirect + webroot для certbot ---
server {
    listen 80;
    server_name alyaeva.pro www.alyaeva.pro;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name alyaeva.pro www.alyaeva.pro;

    ssl_certificate     /etc/nginx/certs/alyaeva.pro/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/alyaeva.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # безопасность
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://vk.com; upgrade-insecure-requests" always;

    # брутфорс/флуд
    limit_req zone=perip burst=20 nodelay;

    location / {
        proxy_pass http://site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(html|css|js|png|jpe?g|webp|svg|woff2?|mp4|webm)$ {
        proxy_pass http://site:80;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}

# ВАЖНО: limit_req zone должна быть объявлена в http{} один раз,
# например в E:\DockerData\nginx\conf.d\00-rate-limit.conf:
#   limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
